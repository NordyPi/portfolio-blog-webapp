# Cloudflare Tunnel -> nginx (this file) -> app:3000
# TLS is terminated by Cloudflare, so nginx only speaks plain HTTP inside Docker's network.

# Cloudflare sets X-Forwarded-Proto: https; fall back to the local scheme when testing on the LAN.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  # Admin photo/video uploads (the app enforces its own per-type limits).
  client_max_body_size 100m;

  # Uploaded media: served straight from the uploads volume, never touching Node.
  # File names are unique per upload, so they can be cached forever.
  location /media/ {
    alias /data/uploads/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    # CF-Connecting-IP (the visitor's real IP) is passed through unchanged.

    # Next.js streams pages (Partial Prerendering), so don't buffer responses.
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }
}
